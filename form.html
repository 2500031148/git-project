<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>

    <h1>Student Registration Form</h1>

    <p>
        Fill in the following details to complete your registration. Ensure
        that all information entered is correct before submitting the form.
    </p>

    <form>

        <label>Full Name</label><br>
        <input type="text" required>
        <br><br>

        <label>Email Address</label><br>
        <input type="email" required>
        <br><br>

        <label>Phone Number</label><br>
        <input type="tel" required>
        <br><br>

        <label>Date of Birth</label><br>
        <input type="date">
        <br><br>

        <label>Gender</label><br>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <input type="radio" name="gender"> Other
        <br><br>

        <label>Select Course</label><br>
        <select>
            <option>B.Tech CSE</option>
            <option>B.Tech AIML</option>
            <option>B.Tech ECE</option>
            <option>B.Tech EEE</option>
            <option>B.Tech Mechanical</option>
        </select>
        <br><br>

        <label>Address</label><br>
        <textarea rows="5" cols="35"></textarea>
        <br><br>

        <label>Hobbies</label><br>
        <input type="checkbox"> Reading
        <input type="checkbox"> Sports
        <input type="checkbox"> Music
        <input type="checkbox"> Coding
        <br><br>

<input type="submit" value="Submit">
<input type="reset" value="Reset">

<br><br>

<a href="login.html">Sign In</a>

</form>

</body>
</html>
