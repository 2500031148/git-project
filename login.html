<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
</head>
<body>

    <h1>User Login</h1>

    <p>
        Please enter your username and password to access the registration
        portal. Make sure your credentials are entered correctly.
    </p>

    <form action="form.html">

        <label>Username</label><br>
        <input type="text" placeholder="Enter Username" required>
        <br><br>

        <label>Password</label><br>
        <input type="password" placeholder="Enter Password" required>
        <br><br>

        <input type="checkbox"> Remember Me
        <br><br>

        <input type="submit" value="Login">
        <input type="reset" value="Clear">

    </form>

    <hr>

    <p>
        <b>Note:</b> This is a sample login page created for educational
        purposes. After successful login, you will be redirected to the
        registration form.
    </p>

</body>
</html>
